meta:
  author: Musheng-bot
  email: meisoren081@gmail.com
pyrobo:
  robot_radius: 0.3 # meter
  time_step: 0.05 # seconds
  map:
    origin_x: 0.0 # meter
    origin_y: 0.0 # meter
    resolution: 0.05 # meter / pixel
    name: "map" # `map/*.pgm` or `map/*.png`
  control:
    mode: maunal # `manual` or `auto`
    dynamics:
      vx_max: 1.5
      vx_min: 0.0
      vy_max: 1.5
      vy_min: 0.0
      acc_max: 1.0 # meter / second^2; not absolute value
      acc_min: -1.0 # meter / second^2; not absolute value
  display:
    show_lidar: false
    show_planning_map: false # if false, show original map; else show planning map
  robot:
    initial:
      x: 0.50
      y: 0.50
      yaw: 0.0
    goal:
      x: 9.50
      y: 7.50
      yaw: 0.0
